# Job Hunter v2: ядро (FastAPI + бот) + Postgres + свой n8n. Живёт рядом с v1 и его не трогает:
# другой compose project (name), другие контейнеры, порты, база и бот.
# Запуск: v2/scripts/deploy.sh (или docker compose up -d из v2/)
name: job-hunter-v2

x-core: &core
  build: .
  image: job-hunter-v2-core
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: UTC
    DATABASE_URL: postgresql+asyncpg://hunter:${POSTGRES_PASSWORD:?заполни POSTGRES_PASSWORD в v2/.env}@postgres:5432/hunter
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    container_name: job-hunter-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?заполни POSTGRES_PASSWORD в v2/.env}
      POSTGRES_DB: hunter
      # Роль и база n8n v2 — создаёт postgres/init.sh при первом старте
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?заполни N8N_DB_PASSWORD в v2/.env}
    volumes:
      - pg17_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d hunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  # REST ядра: /health и /internal/* для n8n v2. Наружу — только этот Mac
  api:
    <<: *core
    container_name: job-hunter-v2-api
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Бот v2: long polling, публичный адрес не нужен (домен ngrok занят ботом v1)
  bot:
    <<: *core
    container_name: job-hunter-v2-bot
    command: ["python", "-m", "app.bot.main"]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.42.3}
    container_name: job-hunter-v2-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_EDITOR_BASE_URL: http://localhost:5679
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?заполни N8N_ENCRYPTION_KEY в v2/.env}
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?заполни N8N_DB_PASSWORD в v2/.env}
      # Ядро для workflow: http://api:8000 + заголовок X-Internal-Token
      CORE_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?заполни INTERNAL_TOKEN в v2/.env}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg17_data:
  n8n_data:
