[project]
name = "job-hunter-v2"
version = "2.0.0"
description = "Job Hunter v2: multi-user, multi-resume job search core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiogram>=3.13",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "selectolax>=0.3.21",
    "google-genai>=1.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
