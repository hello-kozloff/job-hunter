# Локальный n8n для Job Hunter.
# Установка и обновление: node scripts/install.mjs (мастер) → http://localhost:5678
# Имена контейнеров и порты — из .env (COMPOSE_PROJECT_NAME, N8N_PORT, VNC_PORT, APPLIER_PORT): так тестовая установка
# работает рядом с рабочей. По умолчанию — job-hunter-n8n, 5678, 5901, 5682.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-job-hunter}-n8n
    restart: unless-stopped
    ports:
      # Доступ только с этого компьютера, из сети не виден
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      # Расписания и даты по Москве: hh публикует вакансии по МСК
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?заполни N8N_ENCRYPTION_KEY в .env}
      # Интерфейс открывается по http://localhost, secure cookie не нужна
      N8N_SECURE_COOKIE: "false"
      # Разрешить {{ $env.TG_CHAT_ID }} в нодах (в n8n 2.x по умолчанию запрещено)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Data Tables: 100 МБ вместо 50 МБ по умолчанию
      N8N_DATA_TABLES_MAX_SIZE_BYTES: "104857600"
      # История запусков хранится 7 дней: страница поиска hh весит ~1,7 МБ.
      # С 07.10.2026 успешные сборы W1 не хранятся (итог — в таблице runs)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # Сжимать базу при старте n8n: место от удалённых запусков возвращается (деплой перезапускает n8n)
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      # Нейросеть (провайдер — настройка бота ⚙️ → 🤖) и модели; для разбора резюме (W11) можно модель посильнее
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_PROFILE_MODEL: ${GEMINI_PROFILE_MODEL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      # Сводка W6: проверка туннеля снаружи; страж healthchecks.io — сигнал из W1 после каждого сбора
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      HC_PING_URL: ${HC_PING_URL:-}
      # Часовой пояс компьютера — по умолчанию для настройки profile.tz (время в боте, тихие часы, сводка в 10:00)
      USER_TZ: ${USER_TZ:-}
    volumes:
      - n8n_data:/home/node/.n8n
      # Файловые ноды n8n 2.x видят только ~/.n8n-files.
      # Сюда W1 сохраняет HTML, если парсер сломался.
      # Резюме и образцы писем с 13.10.2026 — в таблице settings (профиль), не в файлах
      - ./fixtures:/home/node/.n8n-files/fixtures
    # default — ngrok и робот; llm — Claude по подписке (claude-cli виден только n8n). Без default в списке n8n
    # ушёл бы из общей сети
    networks: [default, llm]

  # Туннель для кнопок Telegram (W3): https://<NGROK_DOMAIN>/webhook/* → n8n.
  # Включается строкой COMPOSE_PROFILES=tunnel в .env; там же NGROK_AUTHTOKEN, NGROK_DOMAIN
  # и WEBHOOK_URL=https://<NGROK_DOMAIN>/ (адрес, который n8n сообщает Telegram).
  # Что пускать внутрь — ngrok/policy.yml: только адреса Telegram и только /webhook/*.
  ngrok:
    image: ngrok/ngrok:${NGROK_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-job-hunter}-ngrok
    restart: unless-stopped
    profiles: [tunnel]
    depends_on: [n8n]
    command:
      - http
      - n8n:5678
      - --url=https://${NGROK_DOMAIN:-}
      - --traffic-policy-file=/etc/ngrok/policy.yml
      - --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./ngrok/policy.yml:/etc/ngrok/policy.yml:ro

  # Робот-отклик (этап 6, docs/stages/stage-6.md): Chromium с окном + HTTP API для n8n (http://applier:3000).
  # Включается профилем applier (COMPOSE_PROFILES в .env), запускается и пересобирается только
  # `scripts/deploy.sh --applier` — обычный деплой его не трогает, чтобы не оборвать отклик.
  # Окно робота: «Общий экран» macOS → vnc://localhost:5901 (5900 занят «Общим экраном» самого Mac).
  # API для CLI scripts/applier.mjs: 127.0.0.1:5682 (5681 — брокер второго CLI-процесса n8n).
  applier:
    build: ./applier
    image: job-hunter-applier
    container_name: ${COMPOSE_PROJECT_NAME:-job-hunter}-applier
    restart: unless-stopped
    profiles: [applier]
    init: true
    # Chromium падает с маленьким /dev/shm
    shm_size: 1gb
    mem_limit: 2g
    # Мягкая остановка: доделать отклик (до 180 с) и сохранить сессию hh
    stop_grace_period: 200s
    ports:
      - "127.0.0.1:${VNC_PORT:-5901}:5900"
      - "127.0.0.1:${APPLIER_PORT:-5682}:3000"
    environment:
      # Без токена робот не стартует (applier/src/server.mjs)
      APPLIER_TOKEN: ${APPLIER_TOKEN:-}
      # Предохранитель: без APPLY_LIVE=1 робот не нажимает «Откликнуться» (сухой прогон до кнопки)
      APPLY_LIVE: ${APPLY_LIVE:-0}
      # Предохранитель резюме: без RESUME_LIVE=1 робот резюме на hh не сохраняет (сухой прогон: формы и снимки)
      RESUME_LIVE: ${RESUME_LIVE:-0}
      APPLIER_FAKE: ${APPLIER_FAKE:-0}
      APPLIER_DAILY_CAP: ${APPLIER_DAILY_CAP:-40}
      HH_RESUME_TITLE: ${HH_RESUME_TITLE:-}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      # Часовой пояс компьютера: браузер робота, «день» робота (с 09:00), тихие часы обслуживания
      USER_TZ: ${USER_TZ:-Europe/Moscow}
      TZ: ${USER_TZ:-Europe/Moscow}
    volumes:
      # Профиль браузера и сессия hh — только в томе: не в репозитории и не в n8n
      - applier_data:/data
      # Разведка и запись — на Mac в fixtures/applier (не в git: там личные данные)
      - ./fixtures/applier:/data/recon
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Claude по подписке (docs/claude-cli.md): официальный claude -p без инструментов + HTTP API для n8n
  # (http://claude-cli:3000). Включается профилем claude — его ставит tunnel-env, если в .env есть
  # CLAUDE_CODE_OAUTH_TOKEN (claude setup-token). Порта на хосте нет: сервис в отдельной сети llm, его видит только
  # n8n (не Chromium робота). Лимит подписки или сбой входа — вызов уходит в запасной Gemini (тот же GEMINI_API_KEY).
  # Обычный деплой пересобирает и перезапускает его каждый раз: состояния нет, образ в кэше
  claude-cli:
    build:
      context: ./claude-cli
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.303}
    image: ${COMPOSE_PROJECT_NAME:-job-hunter}-claude-cli
    container_name: ${COMPOSE_PROJECT_NAME:-job-hunter}-claude-cli
    restart: unless-stopped
    profiles: [claude]
    init: true
    mem_limit: 1536m
    stop_grace_period: 30s
    # Системные промпты и CLAUDE_CONFIG_DIR вызовов — в памяти, не на диске
    tmpfs:
      - /tmp
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Оценки (W2) не берут подписку, если окно лимита занято на эту долю (твоя работа в Claude Code важнее)
      CLAUDE_CLI_SCORE_MAX_UTIL: ${CLAUDE_CLI_SCORE_MAX_UTIL:-0.8}
      # Время сброса лимита CLI пишет по поясу контейнера
      TZ: ${USER_TZ:-Europe/Moscow}
    networks: [llm]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  n8n_data:
  applier_data:

networks:
  llm: {}
